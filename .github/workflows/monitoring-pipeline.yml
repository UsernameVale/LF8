name: Server Monitoring Pipeline

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/10 * * * *'  # Alle 10 Minuten ausführen

jobs:
  monitoring:
    runs-on: ubuntu-latest

    steps:
      - name: Repository klonen
        uses: actions/checkout@v3

      - name: Python installieren
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          pip install psutil

      - name: Monitoring-Skript ausführen
        run: python server_monitoring.py
